# Alembic configuration for Sahayta (Wave 2, Agent 5).
[alembic]
script_location = alembic
prepend_sys_path = .
# Resolved from SAHAYTA_DATABASE_URL at runtime (see env.py); this is a placeholder.
sqlalchemy.url = sqlite+aiosqlite:///./backend/sahayta.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
